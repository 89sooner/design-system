name: Deploy Docs

# JOB-BUILD-004 산출물의 정적 배포. Refs: WP-028 FR-DOC-001 NFR-001 NFR-002 NFR-004
#
# - 수동 실행(workflow_dispatch)이 배포 승인이다. `ref` 입력으로 임의 커밋을
#   재배포할 수 있고, 롤백은 직전 정상 커밋을 ref로 지정한 재배포다. lockfile로
#   고정된 재빌드는 결정적이며 10분 예산(NFR-004) 안에 끝난다 (CR-016).
# - GitHub Pages 배포는 원자적 스냅샷 교체라 방문자가 신·구 자산이 섞인 상태를
#   받지 않는다. 디렉터리 포인터 전환의 의도를 스냅샷 단위로 충족한다 (CR-016).
# - 업로드 전에 Lighthouse LCP 게이트(NFR-001)와 외부 도메인 요청 0건(NFR-002)을
#   통과해야 한다.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "배포(또는 롤백)할 git ref. 롤백이면 직전 정상 커밋을 지정한다"
        required: false
        default: "main"

permissions: {}

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: build, gate, deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lighthouse·외부 요청 게이트가 Playwright Chromium 바이너리를 사용한다.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      # LCP p75 ≤ 2.5초(Fast 3G, NFR-001) + 외부 도메인 요청 0건(NFR-002).
      - run: pnpm lighthouse

      - name: upload lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: test-results/lighthouse.json
          if-no-files-found: ignore
          retention-days: 30

      # GitHub Pages 프로젝트 사이트는 /<repo>/ 하위 경로에서 서빙된다.
      # 해시 라우터가 static hosting에서도 항상 경로를 소유한다. 이전 path 기반 링크는
      # 생성된 404 fallback이 /design-system/#/…로 정규화한다.
      - run: DOCS_BASE=/design-system/ pnpm --filter docs run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

      - id: deployment
        uses: actions/deploy-pages@v4
