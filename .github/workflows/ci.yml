name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VISUAL_REGRESSION_ENABLED: "true"

jobs:
  verify:
    name: verify (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm lint:deps

      # `build` must precede `typecheck`: part of @conductor/tokens' public type
      # surface (tokens.ts, breakpoints.ts) is generated by the token build, so it
      # cannot be type-checked before it exists. Refs: CR-009 DEV-002 FR-TOK-006
      - run: pnpm build

      - run: pnpm typecheck

      # Runs `pnpm test`, which includes the FR-QA-001 cross-theme token contract check.
      - run: pnpm test

      # Both CLIs ship from `packages/tokens/dist`, so they come after `build`.
      # `lint:tokens` is JOB-BUILD-001's literal gate (FR-TOK-001 AC-3, FR-THM-005 AC-3);
      # `check:contrast` is JOB-CI-001 (FR-A11Y-004 AC-2). `build` already produced the report,
      # so this step is the gate rather than the producer.
      - run: pnpm lint:tokens

      - run: pnpm check:contrast

      # JOB-CI-002: public component states are rendered in real Chromium for
      # both themes. Unapproved serious/critical axe findings fail the job.
      - run: pnpm test:a11y

      - name: upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report-node-${{ matrix.node-version }}
          path: test-results/axe-report.json
          if-no-files-found: ignore
          retention-days: 30

      # JOB-CI-004: measures the published, tree-shaken Button consumer bundle
      # with React excluded, plus the complete CSS entry point.
      - run: pnpm size

      - name: upload size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-report-node-${{ matrix.node-version }}
          path: size-report.json
          if-no-files-found: ignore
          retention-days: 30

      # Generated token artifacts are gitignored, so they cannot drift in the repo.
      # What can drift is the build itself: assert a rebuild on an already-built tree
      # is a no-op and that nothing untracked escaped .gitignore.
      #
      # `core.fileMode=false` is required: `pnpm install` chmods every package `bin`
      # entry to 0755, so the tokens CLIs report as modified before this step even
      # runs. Without it this check fails on a clean checkout for a reason that has
      # nothing to do with the token build. Refs: CR-011 DEV-004
      # Refs: CR-009 FR-TOK-001
      - name: token build is reproducible and leaves no untracked files
        run: |
          pnpm --filter @conductor/tokens run build
          untracked="$(git -c core.fileMode=false status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "::error::the token build left files git does not ignore:"
            echo "$untracked"
            exit 1
          fi

  visual:
    name: visual regression (playwright 1.61.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # JOB-CI-003 runs only in the exact browser/font image declared by
      # Dockerfile.visual. The wrapper has no retry path and normal runs cannot
      # update committed baselines. Refs: WP-026 FR-QA-004 AC-2~AC-4
      - run: pnpm test:visual

      - name: upload visual baselines and differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            apps/docs/visual/visual.spec.ts-snapshots/*.png
            test-results/visual/**
          if-no-files-found: error
          retention-days: 30
