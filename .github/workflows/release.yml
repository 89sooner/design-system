name: Release

# JOB-REL-001 (Refs: WP-027 FR-DX-005 NFR-002 NFR-004, ADR-010, 보안 아키텍처 §4·§6):
#
#   1. changeset이 포함된 커밋이 main에 병합되면 `version` 잡이 버전 상승 PR을
#      만들거나 갱신한다. 이 잡은 npm 자격증명과 OIDC 권한을 갖지 않는다(THR-002).
#   2. 버전 상승 PR 병합이 릴리스의 수동 승인이다. 병합 뒤 maintainer가 이
#      워크플로를 수동 실행(workflow_dispatch)하거나 릴리스 태그를 push하면
#      `publish` 잡이 실행된다. GITHUB_TOKEN이 만든 태그는 워크플로를 다시
#      트리거하지 않으므로(재귀 방지) 이 수동 단계가 승인 게이트를 겸한다.
#   3. `publish` 잡은 전체를 다시 빌드하고(로컬/PR 산출물을 신뢰하지 않는다)
#      게이트를 통과한 뒤 OIDC 신뢰 배포로 게시하고 릴리스 태그를 push한다.
#      장기 NPM_TOKEN은 어디에도 저장하지 않는다(NFR-002).
on:
  push:
    branches: [main]
    tags: ["@conductor-by-89soone/*@*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version PR (changesets)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Refs 줄과 major 마이그레이션 노트 규약 (FR-DX-005 AC-2, AC-4)
      - run: pnpm check:changesets

      # version PR 병합 커밋은 changeset을 CHANGELOG/package.json으로 소비한
      # 결과이므로 아래 `status --since`의 입력에 changeset 파일이 남아 있지 않다.
      # 제목만 믿지 않고 bot 작성자와 허용 파일 집합까지 검사한다(CR-030).
      - name: classify a merged Changesets version commit
        id: version_commit
        run: |
          if node scripts/is-version-packages-commit.mjs --quiet; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
          fi

      # 변경 이력 없이 병합된 변경이 발견되면 릴리스를 중단하고 누락 목록을
      # 출력한다 (FR-DX-005 예외 처리). 첫 릴리스 전(태그 없음)에는 기준이 없어
      # 건너뛴다.
      - name: changes since the last release have changesets
        if: steps.version_commit.outputs.matched != 'true'
        run: |
          last_tag="$(git tag --list '@conductor-by-89soone/*@*' --sort=-creatordate | head -n 1)"
          if [ -z "$last_tag" ]; then
            echo "no release tag yet; skipping missing-changeset check (first release)"
            exit 0
          fi
          # 버전 커밋이 HEAD가 아니어도 그 범위는 이미 소비됐다 (PR #6 리뷰 P2).
          #
          # 위 분류는 HEAD 하나만 본다. 버전 PR이 병합된 뒤 수동 게시가 태그를
          # 만들기 전에 문서나 자동화 커밋이 하나라도 `main`에 닿으면 `matched`가
          # 다시 false가 되고, 마지막 태그부터 훑는 `status`는 **그 버전 커밋이
          # 이미 CHANGELOG로 옮긴 범프**를 다시 본다 — changeset 파일은 그때
          # 지워졌으므로 없는 누락을 신고한다.
          #
          # 마지막 태그 이후의 가장 최근 버전 커밋을 찾아 거기서부터 센다.
          since="$last_tag"
          for sha in $(git rev-list "$last_tag"..HEAD); do
            if node scripts/is-version-packages-commit.mjs --quiet --ref "$sha"; then
              since="$sha"
              echo "excluding the range consumed by version commit $sha"
              break
            fi
          done
          pnpm changeset status --since "$since"

      - name: create or update the version PR
        if: steps.version_commit.outputs.matched != 'true'
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          commit: "Version packages"
          title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: await the approved manual publish
        if: steps.version_commit.outputs.matched == 'true'
        run: node scripts/is-version-packages-commit.mjs

  publish:
    name: publish to npm (OIDC)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/@conductor-by-89soone/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 배포 후 릴리스 태그 push
      id-token: write # npm 신뢰 배포(OIDC), NFR-002
    steps:
      # npm provenance는 public source repository에서만 생성된다. private 상태에서
      # publish를 허용하면 NFR-002의 provenance 증거가 조용히 빠지므로 먼저 중단한다.
      - name: require public source repository for provenance
        if: github.event.repository.private
        run: |
          echo "::error title=Public repository required::npm trusted publishing can publish from a private repository, but npm provenance cannot be generated. Make the repository public before release."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires Node >=22.14.0 and npm >=11.5.1.
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Exact pin keeps the OIDC exchange toolchain reproducible.
      - run: npm install -g npm@11.18.0

      - run: pnpm install --frozen-lockfile

      # 버전 상승 PR이 병합되지 않은 상태(소비되지 않은 changeset 존재)에서는
      # 배포하지 않는다.
      - run: node scripts/check-changesets.mjs --require-empty

      # 취약점 게이트: high 이상 1건이라도 있으면 배포하지 않는다 (ADR-010, NFR-002).
      - run: pnpm audit --audit-level high

      - run: pnpm check:secrets

      # 로컬/PR 빌드 산출물을 신뢰하지 않고 전체를 다시 빌드한다 (인프라 운영 §6).
      - run: pnpm build

      # 배포 커밋의 공개 API가 커밋된 리포트와 일치해야 한다 (ADR-008, FR-DX-005 AC-1).
      - run: pnpm check:api

      # changeset publish는 레지스트리에 없는 버전만 게시하므로 재실행에 안전하고,
      # 게시한 버전마다 git 태그를 만든다. provenance 증명을 함께 발행한다.
      # Changesets는 annotated tag 생성 실패를 publish 실패로 전파하지 않으므로,
      # tagger identity를 명시하고 생성 결과를 별도 게이트로 검증한다(CR-025).
      - name: configure release tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # **발행 전에** 레지스트리 상태를 찍고, 그 자리에서 낡은 태그를 막는다 (DEV-041·DEV-042).
      # 이미 있는 버전은 `changeset publish`가 건너뛰므로 그 패키지의 태그는 이전 릴리스의
      # 것이 옳고, 없는 버전은 이 실행이 발행하므로 태그가 release HEAD를 가리켜야 한다.
      # 발행 뒤에는 둘을 구분할 수 없다 — 그때는 양쪽 다 레지스트리에 있다.
      #
      # **이 단계가 발행 앞에 있는 것이 핵심이다.** 뒤의 검사가 같은 어긋남을 잡아도 늦다:
      # tarball이 이미 올라갔고 npm은 같은 버전을 다시 받지 않아 고친 소스로 재발행할 수 없다.
      - name: reject stale release tags and snapshot the registry
        run: pnpm check:release-tags -- --snapshot "$RUNNER_TEMP/published-before.json"

      - name: publish with provenance
        run: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: verify local release tags
        run: pnpm check:release-tags -- --published-before "$RUNNER_TEMP/published-before.json"

      - name: push release tags
        run: git push origin --tags

      - name: verify pushed release tags
        run: pnpm check:release-tags -- --remote origin --published-before "$RUNNER_TEMP/published-before.json"
