# Refs: CR-081 JOB-CI-008 FR-QA-004 AC-3 AC-4 AC-7
# Regenerates the visual regression baselines in the pinned container of
# Dockerfile.visual (the same image JOB-CI-003 compares in) and commits them to
# a pull request branch. Sessions without Docker or the pinned Chromium used to
# rebuild baselines outside that image (DEV-045, DEV-056, DEV-059, DEV-068).
#
# Run it by hand on a branch, never on the default branch. It commits only PNG
# files under the snapshot folder, then dispatches CI on the new commit, because
# a push made with GITHUB_TOKEN does not start the pull_request workflow.
name: Visual baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to update (a pull request branch, never the default branch)
        required: true
        type: string

permissions: {}

concurrency:
  group: visual-baselines-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update:
    name: update visual baselines (playwright 1.61.1)
    runs-on: ubuntu-latest
    # Job ceiling from the job catalog (async jobs §1, CR-084): a hang fails the job instead of holding a runner.
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ inputs.branch }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SNAPSHOTS: apps/docs/visual/visual.spec.ts-snapshots
    steps:
      - name: refuse the default branch and unexpected names
        run: |
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::baselines change through a pull request; pick its branch, not $DEFAULT_BRANCH"
            exit 1
          fi
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::branch name has characters outside [A-Za-z0-9._/-]"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # The only way to rewrite baselines (FR-QA-004 AC-3), inside the pinned image (AC-4).
      - run: pnpm test:visual --update

      - name: verify against the new baselines
        run: pnpm test:visual

      - name: commit changed baselines
        id: commit
        run: |
          git add -- "$SNAPSHOTS"/*.png
          if [ -n "$(git status --porcelain -- . ":(exclude)$SNAPSHOTS")" ]; then
            echo "::error::the update touched files outside $SNAPSHOTS"
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No baseline changed." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(docs): regenerate visual baselines in the pinned container" -m "Refs: CR-081 JOB-CI-008 FR-QA-004"
          git push origin "HEAD:refs/heads/$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # CI checks attach to the commit, so a dispatched run shows on the pull request.
      - name: run CI on the new commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

      - name: upload baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: |
            apps/docs/visual/visual.spec.ts-snapshots/*.png
            test-results/visual/**
          if-no-files-found: ignore
          retention-days: 30
