<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      인라인 SVG 파비콘 (CR-042). 파비콘 파일이 없으면 브라우저가 /favicon.ico를 요청하고
      SPA 폴백이 index.html(약 40KB)을 되돌려 주어, Fast 3G에서 첫 페인트와 대역폭을
      다투는 쓸모없는 요청이 하나 생긴다. 데이터 URI는 요청 자체를 없앤다. 색은 다크 accent와
      text.inverse의 값이며, 파비콘은 테마를 따르지 않는다.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d7cff'/%3E%3Cpath d='M21 11.5a7 7 0 1 0 0 9' fill='none' stroke='%23f4f7fb' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Conductor Design System</title>
    <script>
      (() => {
        try {
          const value = localStorage.getItem("conductor-theme");
          const theme = value === "dark" || value === "light" ? value : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.cdtTheme = theme;
        } catch {
          document.documentElement.dataset.cdtTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 프리렌더 마크업은 "/" 전용이다. 다른 해시로 들어오면 그 마크업이 잠깐 랜딩
      // 페이지로 보였다가 모듈 청크가 도착하는 순간 목적지로 바뀐다. 여기서 미리 비우면
      // 그 잘못된 화면이 한 프레임도 그려지지 않는다. main.tsx의 replaceChildren는
      // 하이드레이션 분기를 위해 그대로 남는다(중복 호출은 무해하다).
      if ((location.hash.replace(/^#/, "") || "/") !== "/") {
        document.getElementById("root").replaceChildren();
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
